[workspace]
resolver = "2"
members = [
    "crates/kushare-proto",
    "crates/kushare-crypto",
    "crates/kushare-core",
    "crates/kushare-discovery",
    "crates/kushare-transfer",
    "crates/kushare-tray",
    "crates/kushare-link",
    "crates/kushare-dbus",
    "crates/kushare-i18n",
    ".",
]

[workspace.package]
version = "0.5.2"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/tysyak/kushare"

[workspace.dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "io-util", "signal"] }
prost = "0.14"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1", features = ["derive"] }

[package]
name = "kushare"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Archivos y notificaciones entre tu PC Linux y tu teléfono (Quick Share, enlace con kushare-android)"

[[bin]]
name = "kushare"
path = "src/main.rs"

[dependencies]
libc = "0.2"
tokio = { workspace = true, features = ["process"] }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
clap = { version = "4", features = ["derive"] }
kushare-core = { path = "crates/kushare-core" }
kushare-crypto = { path = "crates/kushare-crypto" }
kushare-proto = { path = "crates/kushare-proto" }
kushare-discovery = { path = "crates/kushare-discovery" }
kushare-transfer = { path = "crates/kushare-transfer" }
kushare-tray = { path = "crates/kushare-tray" }
tray-icon = { version = "0.25.1", default-features = false, features = ["ksni"] }
rfd = "0.17.2"
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tempfile = "3.27.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
bluer = { version = "0.17.4", features = ["full"] }
kushare-link = { path = "crates/kushare-link" }
zbus = { version = "5.19.0", features = ["tokio"] }
directories = "6"
iced = { version = "0.14", features = ["tokio", "svg", "image", "advanced"] }
kushare-dbus = { path = "crates/kushare-dbus" }
kushare-i18n = { path = "crates/kushare-i18n" }
toml = "0.9"
serde = { workspace = true, features = ["derive"] }
wl-clipboard-rs = "0.9"
serde_json = "1"
arboard = { version = "3", default-features = false }
ureq = "3"
sha2 = "0.10"
if-addrs = "0.15"

[package.metadata.deb]
maintainer = "Cristian Romero Andrade <mascrit@gmail.com>"
copyright = "2026, Cristian Romero Andrade"
license-file = ["LICENSE", "0"]
extended-description = "Cliente nativo open-source del protocolo Quick Share (antes Nearby Share) para Linux, con enlace persistente con la app kushare-android: notificaciones sincronizadas en ambas direcciones, envío y recepción de archivos por Wi-Fi o Bluetooth, icono de bandeja, GUI y CLI. El daemon arranca solo al iniciar sesión."
# Sin libgtk-3: el tray usa el backend ksni (StatusNotifierItem sobre
# D-Bus vía zbus, puro Rust) y el selector de archivos usa el backend
# xdg-desktop-portal de rfd, ninguno de los dos enlaza GTK.
depends = "libdbus-1-3, libbluetooth3, libwayland-client0, libxkbcommon0"
recommends = "zenity, xdg-desktop-portal"
section = "net"
priority = "optional"
assets = [
    ["target/release/kushare", "usr/bin/", "755"],
    ["target/release/kushare-tui", "usr/bin/", "755"],
    ["target/release/kushare-gui", "usr/bin/", "755"],
    ["packaging/common/kushare.desktop", "usr/share/applications/", "644"],
    ["packaging/common/kushare-autostart.desktop", "etc/xdg/autostart/kushare.desktop", "644"],
    ["packaging/common/kushare.service", "usr/lib/systemd/user/", "644"],
    ["packaging/common/kushare.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/kushare/", "644"],
    ["FAQ.md", "usr/share/doc/kushare/", "644"],
    ["SECURITY.md", "usr/share/doc/kushare/", "644"],
    ["CHANGELOG.md", "usr/share/doc/kushare/", "644"],
]

[package.metadata.generate-rpm]
license = "GPLv3+"
assets = [
    { source = "target/release/kushare", dest = "/usr/bin/kushare", mode = "755" },
    { source = "target/release/kushare-tui", dest = "/usr/bin/kushare-tui", mode = "755" },
    { source = "target/release/kushare-gui", dest = "/usr/bin/kushare-gui", mode = "755" },
    { source = "packaging/common/kushare.desktop", dest = "/usr/share/applications/kushare.desktop", mode = "644" },
    { source = "packaging/common/kushare-autostart.desktop", dest = "/etc/xdg/autostart/kushare.desktop", mode = "644", config = true },
    { source = "packaging/common/kushare.service", dest = "/usr/lib/systemd/user/kushare.service", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/kushare/README.md", mode = "644", doc = true },
    { source = "FAQ.md", dest = "/usr/share/doc/kushare/FAQ.md", mode = "644", doc = true },
    { source = "SECURITY.md", dest = "/usr/share/doc/kushare/SECURITY.md", mode = "644", doc = true },
    { source = "CHANGELOG.md", dest = "/usr/share/doc/kushare/CHANGELOG.md", mode = "644", doc = true },
    { source = "packaging/common/kushare.svg", dest = "/usr/share/icons/hicolor/scalable/apps/kushare.svg", mode = "644" },
]
requires = { "dbus-libs" = "*", "bluez-libs" = "*", "libwayland-client" = "*", "libxkbcommon" = "*" }
