// Protocolo propio del enlace persistente kushare <-> kushare (escritorio y
// Android). NO es parte de Quick Share: viaja por su propio servicio mDNS
// (`_kushare-link._tcp.local.`) / UUID RFCOMM, cifrado con el mismo canal
// UKEY2 + SecureMessage que las transferencias (ver crates/kushare-link).
//
// Cada mensaje en el cable es exactamente un `LinkFrame` codificado.
// Compatibilidad: solo se AÑADEN campos/variantes; nunca se reutilizan
// números de campo. `Hello.protocol_version` sube cuando un cambio no sea
// retrocompatible.

syntax = "proto3";

package kushare.link;

message LinkFrame {
  oneof kind {
    Hello hello = 1;
    AuthProof auth_proof = 2;
    PairRequest pair_request = 3;
    PairResponse pair_response = 4;
    Unpair unpair = 5;
    Ping ping = 6;
    Pong pong = 7;
    DirectionConfig direction_config = 8;
    AppFilter app_filter = 9;
    Notification notification = 10;
    NotificationRemoved notification_removed = 11;
    InvokeAction invoke_action = 12;
    Reply reply = 13;
    Ready ready = 14;
    // Funciones extra (batería, multimedia, audio, timbre, fotos, llamadas).
    // El enlace solo las transporta; cada plataforma las interpreta.
    Feature feature = 15;
  }
}

// Primer mensaje que manda cada lado tras el handshake UKEY2.
message Hello {
  uint32 protocol_version = 1;
  // Identificador estable derivado de `public_key` (ver kushare-link::identity).
  string device_id = 2;
  string device_name = 3;
  // Clave pública Ed25519 a largo plazo (32 bytes).
  bytes public_key = 4;
  // "desktop" | "android"; solo informativo para la UI.
  string device_kind = 5;
  // Capacidades opcionales que este lado entiende, p. ej. "notifications",
  // "notification-actions", "notification-reply".
  repeated string capabilities = 6;
  // Dirección Bluetooth propia si el emisor la conoce ("AA:BB:..."). En
  // Android no se puede leer (devuelve 02:00:00:00:00:00), así que va
  // vacía; el escritorio sí la manda para que el Android pueda reconectar
  // por RFCOMM si no hay Wi-Fi.
  string bt_address = 7;
  // Puerto TCP en el que este lado acepta el enlace (0 = no escucha por
  // TCP). Con la IP de origen de la conexión, el otro lado sabe a dónde
  // reconectar por Wi-Fi sin tener que escanear la red.
  uint32 tcp_port = 8;
}

// Prueba de posesión de la clave a largo plazo, atada a esta sesión UKEY2:
// firma Ed25519 de "kushare-link-v1" || rol || auth_string.
message AuthProof {
  bytes signature = 1;
}

// El iniciador pide emparejarse; ambos lados muestran el PIN derivado del
// auth_string y el usuario confirma en los dos.
message PairRequest {}

message PairResponse {
  bool accepted = 1;
}

// El emisor ha olvidado a este peer (o nunca lo conoció); el receptor
// debe olvidarlo también y cerrar.
message Unpair {}

// "Te conozco y te he autenticado": tras `AuthProof`, el iniciador manda
// `Ready` (reconexión de un peer ya emparejado) o `PairRequest`; el
// respondedor contesta `Ready` si también lo conoce, o `Unpair` si no.
message Ready {
  // Conexión adicional de DATOS (modo híbrido): el control sigue por el
  // enlace principal (normalmente Bluetooth) y por esta, normalmente Wi-Fi,
  // va solo el tráfico pesado. Se cierra sola tras un rato sin uso.
  bool bulk = 1;
}

message Ping {
  uint64 nonce = 1;
}

message Pong {
  uint64 nonce = 1;
}

// Si las notificaciones de `from_device_id` se reenvían a `to_device_id`.
// Se sincroniza en ambos sentidos con last-writer-wins por `version`.
message DirectionConfig {
  string from_device_id = 1;
  string to_device_id = 2;
  bool enabled = 3;
  uint64 version = 4;
  // device_id de quien hizo el último cambio (desempate en igualdad).
  string updated_by = 5;
}

// Apps cuyas notificaciones NO se reenvían de `from_device_id` a
// `to_device_id`. El conjunto completo se reemplaza (LWW por `version`).
message AppFilter {
  string from_device_id = 1;
  string to_device_id = 2;
  repeated string blocked_app_ids = 3;
  uint64 version = 4;
  string updated_by = 5;
}

message NotificationAction {
  string id = 1;
  string label = 2;
  // Acepta texto libre (RemoteInput en Android).
  bool is_reply = 3;
}

message Notification {
  // Identificador estable en el emisor (StatusBarNotification.key en
  // Android; "<id D-Bus>" en escritorio). Repetir la key actualiza.
  string key = 1;
  // Paquete en Android; `app_name` D-Bus (o desktop-entry) en escritorio.
  string app_id = 2;
  string app_name = 3;
  string title = 4;
  string text = 5;
  int64 timestamp_ms = 6;
  // SHA-256 hex del PNG del icono; vacío si no hay icono.
  string icon_hash = 7;
  // PNG del icono (~64 px). Solo se envía la primera vez por sesión para
  // cada `icon_hash`; después el receptor lo tiene en caché.
  bytes icon_png = 8;
  repeated NotificationAction actions = 9;
}

message NotificationRemoved {
  string key = 1;
  // false: la notificación `key` del EMISOR desapareció (cerrar el espejo).
  // true: el usuario descartó en el emisor el espejo de una notificación
  // del RECEPTOR; el receptor debe cancelar su notificación original.
  bool owner_is_receiver = 2;
}

// Pide al dueño original de la notificación `key` que ejecute la acción.
message InvokeAction {
  string key = 1;
  string action_id = 2;
}

// Respuesta de texto para una acción con `is_reply`.
message Reply {
  string key = 1;
  string action_id = 2;
  string text = 3;
}

// ---------------------------------------------------------------------------
// Funciones extra. Solo entre peers emparejados y autenticados; no dependen
// de la configuración de notificaciones. Los mensajes de "estado" se mandan
// completos (no deltas) al conectar y cada vez que cambian.
// ---------------------------------------------------------------------------

message Feature {
  oneof kind {
    BatteryStatus battery = 1;
    MediaPlayers media_players = 2;
    MediaCommand media_command = 3;
    AudioOutputs audio_outputs = 4;
    SetAudioOutput set_audio_output = 5;
    RingerMode ringer_mode = 6;
    SetRingerMode set_ringer_mode = 7;
    PhotoListRequest photo_list_request = 8;
    PhotoList photo_list = 9;
    PhotoRequest photo_request = 10;
    PhotoData photo_data = 11;
    CallState call_state = 12;
    CallCommand call_command = 13;
    PhotosChanged photos_changed = 14;
    ClipboardContent clipboard = 15;
    SmsThreadsRequest sms_threads_request = 16;
    SmsThreads sms_threads = 17;
    SmsMessagesRequest sms_messages_request = 18;
    SmsMessages sms_messages = 19;
    SendSms send_sms = 20;
    SmsChanged sms_changed = 21;
    CallLogRequest call_log_request = 22;
    CallLog call_log = 23;
    ContactsRequest contacts_request = 24;
    Contacts contacts = 25;
    Dial dial = 26;
    ActiveNotificationsRequest active_notifications_request = 27;
    ActiveNotifications active_notifications = 28;
    WallpaperRequest wallpaper_request = 29;
    Wallpaper wallpaper = 30;
    PhotoDelete photo_delete = 31;
    CommandResult command_result = 32;
    LanAddress lan_address = 33;
  }
}

// Batería del emisor. `present = false`: no tiene batería (PC de
// sobremesa); el receptor no muestra nada.
message BatteryStatus {
  bool present = 1;
  uint32 percent = 2;
  bool charging = 3;
}

enum PlaybackState {
  PLAYBACK_STOPPED = 0;
  PLAYBACK_PLAYING = 1;
  PLAYBACK_PAUSED = 2;
}

message MediaPlayer {
  // Identificador estable en el emisor (nombre D-Bus MPRIS, paquete
  // Android + sesión).
  string id = 1;
  // Nombre legible del reproductor ("Spotify", "mpd", "YouTube"…).
  string name = 2;
  string title = 3;
  string artist = 4;
  string album = 5;
  PlaybackState state = 6;
  bool can_play = 7;
  bool can_pause = 8;
  bool can_next = 9;
  bool can_previous = 10;
}

// Lista completa de reproductores del emisor.
message MediaPlayers {
  repeated MediaPlayer players = 1;
}

enum MediaAction {
  MEDIA_PLAY_PAUSE = 0;
  MEDIA_PLAY = 1;
  MEDIA_PAUSE = 2;
  MEDIA_NEXT = 3;
  MEDIA_PREVIOUS = 4;
  MEDIA_STOP = 5;
}

// `player_id` vacío = todos los reproductores ("pausar todo").
message MediaCommand {
  string player_id = 1;
  MediaAction action = 2;
}

message AudioOutput {
  string id = 1;
  string name = 2;
  // Es la salida que usa ahora el sistema (por defecto / activa).
  bool active = 3;
}

message AudioOutputs {
  repeated AudioOutput outputs = 1;
  // El receptor puede pedir cambiarla con `SetAudioOutput`.
  bool selectable = 2;
}

message SetAudioOutput {
  string id = 1;
}

enum Ringer {
  RINGER_NORMAL = 0;
  RINGER_VIBRATE = 1;
  RINGER_SILENT = 2;
}

// Modo de timbre del emisor (solo lo manda Android).
message RingerMode {
  Ringer mode = 1;
}

message SetRingerMode {
  Ringer mode = 1;
}

// Pide una página de la galería (más reciente primero). La respuesta
// lleva el mismo `request_id`.
message PhotoListRequest {
  uint64 request_id = 1;
  uint32 offset = 2;
  uint32 limit = 3;
  // Ids cuya miniatura ya tiene el que pide (en caché): se mandan sin
  // `thumbnail`, para que recargar por Bluetooth cueste casi nada.
  repeated string have_thumbnails = 4;
}

message PhotoInfo {
  string id = 1;
  string name = 2;
  int64 date_ms = 3;
  uint32 width = 4;
  uint32 height = 5;
  uint64 size = 6;
  // Miniatura JPEG pequeña (~200 px).
  bytes thumbnail = 7;
}

message PhotoList {
  uint64 request_id = 1;
  uint32 total = 2;
  repeated PhotoInfo photos = 3;
}

// Pide la foto original; se responde con uno o varios `PhotoData`.
message PhotoRequest {
  uint64 request_id = 1;
  string id = 2;
  // Tamaño máximo de cada `PhotoData` (0 = el del emisor). Las descargas de
  // fondo piden trozos pequeños para no frenar el resto del enlace.
  uint32 chunk_size = 3;
  // Descarga de fondo (precarga): el emisor manda cada trozo solo cuando
  // su cola de salida está vacía, para que lo demás no espere.
  bool background = 4;
}

// Trozo de la foto original (`offset` en bytes). `last` cierra la
// respuesta; `error` no vacío = no se pudo leer.
message PhotoData {
  uint64 request_id = 1;
  string id = 2;
  string name = 3;
  uint64 offset = 4;
  bytes data = 5;
  bool last = 6;
  string error = 7;
}

// La galería del emisor cambió (foto o captura nueva): el receptor que la
// esté mostrando pide las más recientes con `PhotoListRequest`.
message PhotosChanged {}

enum CallPhase {
  CALL_IDLE = 0;
  CALL_RINGING = 1;
  CALL_ACTIVE = 2;
  CALL_DIALING = 3;
}

message CallState {
  CallPhase phase = 1;
  string number = 2;
  // Nombre del contacto si se conoce.
  string name = 3;
  bool muted = 4;
}

enum CallAction {
  CALL_ANSWER = 0;
  CALL_REJECT = 1;
  CALL_HANGUP = 2;
  CALL_MUTE = 3;
  CALL_UNMUTE = 4;
}

message CallCommand {
  CallAction action = 1;
}

// ---------------------------------------------------------------------------
// Portapapeles, SMS, llamadas, contactos, notificaciones activas, fondo de
// pantalla y borrado de fotos (0.4.0).
//
// Las peticiones llevan `request_id` y la respuesta lo repite; `error` no
// vacío = no se pudo (casi siempre falta un permiso en el teléfono).
// ---------------------------------------------------------------------------

// Texto copiado en el emisor. El receptor lo pone en su portapapeles.
message ClipboardContent {
  string text = 1;
  int64 timestamp_ms = 2;
}

// Conversaciones de SMS, la más reciente primero.
message SmsThreadsRequest {
  uint64 request_id = 1;
  uint32 offset = 2;
  uint32 limit = 3;
}

message SmsThread {
  string thread_id = 1;
  // Número (o números separados por coma en un grupo).
  string address = 2;
  // Nombre del contacto si se conoce.
  string name = 3;
  // Texto del último mensaje.
  string snippet = 4;
  int64 date_ms = 5;
  bool unread = 6;
  uint32 count = 7;
  // El último mensaje lo mandó el dueño del teléfono.
  bool outgoing = 8;
}

message SmsThreads {
  uint64 request_id = 1;
  repeated SmsThread threads = 2;
  string error = 3;
  uint32 total = 4;
}

// Mensajes de una conversación, del más reciente hacia atrás.
// `before_ms` > 0: solo los anteriores a esa fecha (paginar).
message SmsMessagesRequest {
  uint64 request_id = 1;
  string thread_id = 2;
  uint32 limit = 3;
  int64 before_ms = 4;
}

message SmsMessage {
  string id = 1;
  string address = 2;
  string body = 3;
  int64 date_ms = 4;
  bool outgoing = 5;
  bool read = 6;
  // Saliente que falló al enviarse.
  bool failed = 7;
}

message SmsMessages {
  uint64 request_id = 1;
  string thread_id = 2;
  // Más reciente primero.
  repeated SmsMessage messages = 3;
  string error = 4;
}

// Mandar un SMS desde el teléfono. Se responde con `CommandResult`.
message SendSms {
  uint64 request_id = 1;
  string address = 2;
  string body = 3;
}

// Llegó o se mandó un SMS: el receptor que muestre los mensajes refresca.
message SmsChanged {
  string thread_id = 1;
}

enum CallType {
  CALL_TYPE_INCOMING = 0;
  CALL_TYPE_OUTGOING = 1;
  CALL_TYPE_MISSED = 2;
  CALL_TYPE_REJECTED = 3;
  CALL_TYPE_BLOCKED = 4;
  CALL_TYPE_VOICEMAIL = 5;
}

message CallLogRequest {
  uint64 request_id = 1;
  uint32 limit = 2;
}

message CallLogEntry {
  string number = 1;
  string name = 2;
  int64 date_ms = 3;
  uint32 duration_s = 4;
  CallType type = 5;
}

message CallLog {
  uint64 request_id = 1;
  // Más reciente primero.
  repeated CallLogEntry entries = 2;
  string error = 3;
}

message ContactsRequest {
  uint64 request_id = 1;
}

message Contact {
  string name = 1;
  repeated string numbers = 2;
  bool starred = 3;
}

message Contacts {
  uint64 request_id = 1;
  repeated Contact contacts = 2;
  string error = 3;
}

// Llamar a `number` desde el teléfono. Se responde con `CommandResult`.
message Dial {
  uint64 request_id = 1;
  string number = 2;
}

// Notificaciones que hay ahora mismo en el teléfono (todas, no solo las
// que se reenvían). `have_icons`: hashes que el que pide ya tiene.
message ActiveNotificationsRequest {
  uint64 request_id = 1;
  repeated string have_icons = 2;
}

message ActiveNotifications {
  uint64 request_id = 1;
  repeated Notification notifications = 2;
  string error = 3;
}

message WallpaperRequest {
  uint64 request_id = 1;
  // Lado mayor máximo de la imagen en píxeles.
  uint32 max_size = 2;
}

// Fondo de pantalla del teléfono. Sin permiso para leerlo, `jpeg` va vacío
// y `colors` trae sus colores principales (ARGB) para pintar un degradado.
message Wallpaper {
  uint64 request_id = 1;
  bytes jpeg = 2;
  repeated uint32 colors = 3;
  string error = 4;
}

// Borrar una foto de la galería. El teléfono puede pedir confirmación al
// usuario (`CommandResult.status = "confirm"`).
message PhotoDelete {
  uint64 request_id = 1;
  string id = 2;
}

// Resultado de una orden (`SendSms`, `Dial`, `PhotoDelete`).
message CommandResult {
  uint64 request_id = 1;
  bool ok = 2;
  string error = 3;
  // "done" | "confirm" (hay que confirmarlo en el teléfono).
  string status = 4;
}

// Dónde escucha el emisor por la red local (modo híbrido): el receptor
// abre ahí, cuando lo necesita, un enlace de datos (`Ready.bulk`) para el
// tráfico pesado. `addrs` vacío = no usar Wi-Fi (solo Bluetooth o sin red).
message LanAddress {
  repeated string addrs = 1;
  uint32 port = 2;
}
